<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>铁路动态规划图 · 事件驱动</title>
    <style>
        /* 全局重置 & 字体 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
        }
        body {
            background: #0b0e14;
            color: #eef2f6;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ===== 顶部栏 ===== */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: #161c26;
            border-bottom: 1px solid #2a3340;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px 12px;
        }
        .top-bar .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 0.5px;
        }
        .top-bar .brand .icon {
            font-size: 24px;
        }
        .top-bar .brand span {
            background: linear-gradient(90deg, #f6b83e, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .top-bar .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .top-bar .controls .btn {
            padding: 5px 14px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            background: #2a3340;
            color: #c8d0dc;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .top-bar .controls .btn:hover {
            background: #3a4556;
            color: #fff;
        }
        .top-bar .controls .btn.primary {
            background: #f5a623;
            color: #0b0e14;
        }
        .top-bar .controls .btn.primary:hover {
            background: #f6b83e;
        }
        .top-bar .controls .btn.danger {
            background: #c0392b;
            color: #fff;
        }
        .top-bar .controls .btn.danger:hover {
            background: #e74c3c;
        }
        .top-bar .controls .btn.success {
            background: #27ae60;
            color: #fff;
        }
        .top-bar .controls .btn.success:hover {
            background: #2ecc71;
        }
        .top-bar .controls .btn.outline {
            background: transparent;
            border: 1px solid #3a4556;
        }
        .top-bar .controls .btn.outline:hover {
            background: #1e2632;
        }
        .top-bar .controls .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .top-bar .play-status {
            font-size: 13px;
            color: #8a9bb5;
            background: #1e2632;
            padding: 2px 14px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .top-bar .play-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .top-bar .play-status .dot.running {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc7180;
        }
        .top-bar .play-status .dot.paused {
            background: #f5a623;
        }
        .top-bar .play-status .dot.stopped {
            background: #7f8c8d;
        }

        /* ===== 主体 ===== */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ===== 画布区 ===== */
        .canvas-wrap {
            flex: 1;
            position: relative;
            background: #0f141c;
            overflow: hidden;
        }
        .canvas-wrap canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        /* 画布上的坐标提示 */
        .coord-tip {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(11, 14, 20, 0.75);
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            color: #8a9bb5;
            border: 1px solid #2a3340;
            pointer-events: none;
            font-family: monospace;
        }

        /* ===== 右侧面板 ===== */
        .panel {
            width: 380px;
            background: #131b24;
            border-left: 1px solid #2a3340;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }
        .panel .panel-header {
            padding: 12px 18px;
            border-bottom: 1px solid #2a3340;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .panel .panel-header h3 {
            font-size: 15px;
            font-weight: 600;
            color: #c8d0dc;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel .panel-header .badge {
            background: #2a3340;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: #8a9bb5;
        }
        .panel .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 16px;
        }
        .panel .panel-body::-webkit-scrollbar {
            width: 4px;
        }
        .panel .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .panel .panel-body::-webkit-scrollbar-thumb {
            background: #2a3340;
            border-radius: 4px;
        }

        /* ===== 事件列表 ===== */
        .event-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .event-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: #1a232e;
            border-radius: 6px;
            border-left: 3px solid transparent;
            font-size: 13px;
            transition: all 0.15s;
            cursor: default;
            position: relative;
        }
        .event-item .idx {
            color: #4a5a70;
            font-size: 11px;
            min-width: 24px;
            text-align: right;
            font-family: monospace;
        }
        .event-item .icon {
            font-size: 16px;
            width: 24px;
            text-align: center;
        }
        .event-item .desc {
            flex: 1;
            color: #c8d0dc;
            word-break: break-word;
            font-size: 12.5px;
        }
        .event-item .desc .highlight {
            color: #f5a623;
        }
        .event-item .del-btn {
            background: none;
            border: none;
            color: #4a5a70;
            cursor: pointer;
            font-size: 14px;
            padding: 0 4px;
            transition: color 0.2s;
        }
        .event-item .del-btn:hover {
            color: #e74c3c;
        }
        .event-item.active {
            background: #1e2a3a;
            border-left-color: #f5a623;
            box-shadow: inset 0 0 0 1px #2a3340;
        }
        .event-item.executed {
            opacity: 0.5;
            border-left-color: #27ae60;
        }
        .event-item.executed .desc {
            color: #6a7a8a;
        }
        .event-item.pending {
            border-left-color: #3a4556;
        }
        .event-item .line-color-sample {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid #2a3340;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            color: #4a5a70;
            padding: 40px 10px;
            font-size: 14px;
        }
        .empty-state .big-icon {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== 事件编辑浮层 (内嵌) ===== */
        .event-editor {
            background: #1a232e;
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 12px;
            border: 1px solid #2a3340;
        }
        .event-editor .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 6px;
        }
        .event-editor .row label {
            font-size: 12px;
            color: #8a9bb5;
            min-width: 40px;
        }
        .event-editor .row input,
        .event-editor .row select {
            background: #0f141c;
            border: 1px solid #2a3340;
            border-radius: 4px;
            padding: 4px 10px;
            color: #eef2f6;
            font-size: 12px;
            outline: none;
            transition: border 0.2s;
            flex: 1;
            min-width: 60px;
        }
        .event-editor .row input:focus,
        .event-editor .row select:focus {
            border-color: #f5a623;
        }
        .event-editor .row input[type="color"] {
            padding: 2px;
            height: 30px;
            width: 40px;
            flex: 0 0 40px;
            cursor: pointer;
        }
        .event-editor .row input[type="number"] {
            max-width: 80px;
        }
        .event-editor .actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            justify-content: flex-end;
        }
        .event-editor .actions .btn {
            padding: 4px 16px;
            border: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .event-editor .actions .btn.add {
            background: #27ae60;
            color: #fff;
        }
        .event-editor .actions .btn.add:hover {
            background: #2ecc71;
        }
        .event-editor .actions .btn.cancel {
            background: #2a3340;
            color: #c8d0dc;
        }
        .event-editor .actions .btn.cancel:hover {
            background: #3a4556;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            .panel {
                width: 320px;
            }
        }
        @media (max-width: 700px) {
            .main {
                flex-direction: column-reverse;
            }
            .panel {
                width: 100%;
                max-height: 45vh;
                border-left: none;
                border-top: 1px solid #2a3340;
            }
            .top-bar .brand {
                font-size: 15px;
            }
            .top-bar .controls .btn {
                font-size: 12px;
                padding: 4px 10px;
            }
        }
        @media (max-width: 480px) {
            .top-bar .brand .icon {
                font-size: 18px;
            }
            .top-bar .controls .btn span.hide-m {
                display: none;
            }
            .event-item {
                font-size: 12px;
                padding: 4px 8px;
            }
            .event-item .desc {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部栏 ===== -->
    <header class="top-bar">
        <div class="brand">
            <span class="icon">🚆</span>
            <span>铁路规划 · 事件驱动</span>
        </div>
        <div class="controls">
            <button class="btn primary" id="btnPlay">▶ 播放</button>
            <button class="btn outline" id="btnPause">⏸ 暂停</button>
            <button class="btn outline" id="btnReset">⏹ 重置</button>
            <span class="play-status" id="playStatus">
                <span class="dot stopped" id="statusDot"></span>
                <span id="statusText">已停止</span>
            </span>
            <button class="btn success" id="btnAddEvent">➕ 添加事件</button>
            <button class="btn danger" id="btnClearEvents">🗑 清空</button>
        </div>
    </header>

    <!-- ===== 主体 ===== -->
    <div class="main">

        <!-- 画布 -->
        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="railCanvas"></canvas>
            <div class="coord-tip" id="coordTip">🖱 悬停查看坐标</div>
        </div>

        <!-- 右侧面板 -->
        <div class="panel" id="panel">
            <div class="panel-header">
                <h3>📋 事件时间轴</h3>
                <span class="badge" id="eventCount">0 个事件</span>
            </div>
            <div class="panel-body" id="panelBody">
                <!-- 事件编辑器 (动态显示) -->
                <div id="eventEditorContainer"></div>
                <!-- 事件列表 -->
                <div class="event-list" id="eventList"></div>
            </div>
        </div>
    </div>

    <script>
        // ================================================================
        //  核心数据
        // ================================================================

        // 事件类型
        const EVENT_TYPES = {
            WAIT: 'wait',
            CAMERA: 'camera',
            CREATE_LINE: 'createLine',
            CREATE_NODE: 'createNode',
            CREATE_STATION: 'createStation',
        };

        // 默认背景图片 (纯色占位, 用户可替换)
        const DEFAULT_BG_COLOR = '#1a2330';

        // 状态
        let events = [];
        let currentIndex = 0; // 当前执行到的事件索引 (0 ~ events.length-1)
        let isPlaying = false;
        let isPaused = false;
        let playTimer = null;
        let eventProgress = 0; // 0~1 当前事件的进度

        // 画布 & 相机
        let canvas, ctx;
        let canvasW = 0,
            canvasH = 0;
        let bgImage = null; // 背景图片对象
        let bgImageLoaded = false;

        // 相机状态 (左下角为原点, 像素坐标)
        let camera = {
            x: 0, // 视野中心 x (像素)
            y: 0, // 视野中心 y (像素)
            zoom: 1.0, // 缩放倍数 (1.0 = 原始大小)
        };

        // 线路数据 (由事件动态构建)
        let linesData = {}; // lineId -> { id, name, color, nodes: [{x,y}], stations: [{id, name, en, x, y}] }

        // 当前选中的事件 (用于编辑)
        let selectedEventIdx = -1;

        // ================================================================
        //  初始化
        // ================================================================

        function init() {
            canvas = document.getElementById('railCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', () => { resizeCanvas();
                render(); });

            // 生成示例事件 (让用户快速上手)
            generateDemoEvents();

            // 渲染
            render();
            updateEventList();
            updateStats();

            // 绑定 UI
            bindUI();

            // 鼠标坐标提示
            canvas.addEventListener('mousemove', (e) => {
                const pos = getCanvasCoords(e);
                document.getElementById('coordTip').textContent =
                    `🖱 (${Math.round(pos.x)}, ${Math.round(pos.y)})  |  缩放 ${(camera.zoom * 100).toFixed(0)}%`;
            });
            canvas.addEventListener('mouseleave', () => {
                document.getElementById('coordTip').textContent = '🖱 悬停查看坐标';
            });
        }

        // ================================================================
        //  画布尺寸 & 坐标转换
        // ================================================================

        function resizeCanvas() {
            const wrap = document.getElementById('canvasWrap');
            const rect = wrap.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvasW = rect.width;
            canvasH = rect.height;
            canvas.width = canvasW * dpr;
            canvas.height = canvasH * dpr;
            canvas.style.width = canvasW + 'px';
            canvas.style.height = canvasH + 'px';
            ctx.scale(dpr, dpr);
        }

        // 获取鼠标在画布上的像素坐标 (左下角为原点)
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvasW / rect.width;
            const scaleY = canvasH / rect.height;
            const clientX = e.clientX || 0;
            const clientY = e.clientY || 0;
            const px = (clientX - rect.left) * scaleX;
            const py = (clientY - rect.top) * scaleY;
            // 转换为左下角原点: y = canvasH - py
            return { x: px, y: canvasH - py };
        }

        // 将世界坐标 (像素, 左下角原点) 转换为屏幕坐标 (左上角原点)
        function worldToScreen(wx, wy) {
            // 应用相机: 平移 + 缩放
            const cx = (wx - camera.x) * camera.zoom + canvasW / 2;
            const cy = (wy - camera.y) * camera.zoom + canvasH / 2;
            // 屏幕 y 轴向下, 所以翻转
            return { x: cx, y: canvasH - cy };
        }

        // 屏幕坐标转世界坐标
        function screenToWorld(sx, sy) {
            const wx = (sx - canvasW / 2) / camera.zoom + camera.x;
            const wy = (canvasH - sy - canvasH / 2) / camera.zoom + camera.y;
            return { x: wx, y: wy };
        }

        // ================================================================
        //  渲染引擎
        // ================================================================

        function render() {
            ctx.clearRect(0, 0, canvasW, canvasH);

            // ---- 背景 ----
            if (bgImage && bgImageLoaded) {
                // 绘制背景图片 (填满画布)
                const imgAspect = bgImage.width / bgImage.height;
                const canvasAspect = canvasW / canvasH;
                let drawW, drawH, ox = 0,
                    oy = 0;
                if (imgAspect > canvasAspect) {
                    drawW = canvasW;
                    drawH = canvasW / imgAspect;
                    oy = (canvasH - drawH) / 2;
                } else {
                    drawH = canvasH;
                    drawW = canvasH * imgAspect;
                    ox = (canvasW - drawW) / 2;
                }
                ctx.drawImage(bgImage, ox, oy, drawW, drawH);
            } else {
                ctx.fillStyle = DEFAULT_BG_COLOR;
                ctx.fillRect(0, 0, canvasW, canvasH);
                // 网格
                ctx.strokeStyle = 'rgba(255,255,255,0.04)';
                ctx.lineWidth = 1;
                const step = 60;
                for (let x = step; x < canvasW; x += step) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasH);
                    ctx.stroke();
                }
                for (let y = step; y < canvasH; y += step) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvasW, y);
                    ctx.stroke();
                }
            }

            // ---- 绘制所有线路 ----
            // 先收集所有线路数据 (从事件中构建)
            const lines = buildLinesFromEvents();
            for (const lineId in lines) {
                const line = lines[lineId];
                if (line.nodes.length < 2) continue;
                drawLine(ctx, line);
            }

            // ---- 绘制站点 ----
            for (const lineId in lines) {
                const line = lines[lineId];
                for (const st of line.stations) {
                    drawStation(ctx, st, line.color);
                }
            }

            // ---- 绘制站点名称 ----
            for (const lineId in lines) {
                const line = lines[lineId];
                for (const st of line.stations) {
                    drawStationLabel(ctx, st);
                }
            }

            // ---- 绘制坐标轴提示 (左下角) ----
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.font = '11px monospace';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            const origin = worldToScreen(0, 0);
            ctx.fillText('O (0,0)', origin.x + 6, canvasH - origin.y - 4);

            // ---- 当前执行进度指示 ----
            if (isPlaying || isPaused) {
                const idx = Math.min(currentIndex, events.length - 1);
                if (idx >= 0 && idx < events.length) {
                    const ev = events[idx];
                    const pct = Math.min(eventProgress, 1);
                    ctx.fillStyle = 'rgba(245,166,35,0.12)';
                    ctx.fillRect(0, 0, canvasW * pct, 4);
                }
            }

            // ---- 水印 / 状态 ----
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`缩放 ${(camera.zoom * 100).toFixed(0)}%`, canvasW - 16, canvasH - 12);
        }

        // ---- 从事件中构建线路数据 ----
        function buildLinesFromEvents() {
            const lines = {};
            let currentLineId = null;

            for (let i = 0; i <= currentIndex; i++) {
                if (i >= events.length) break;
                const ev = events[i];
                if (ev.type === EVENT_TYPES.CREATE_LINE) {
                    const id = ev.lineId || 'line_' + Date.now() + '_' + i;
                    if (!lines[id]) {
                        lines[id] = {
                            id: id,
                            name: ev.name || '未命名',
                            color: ev.color || '#f5a623',
                            nodes: [],
                            stations: [],
                        };
                    }
                    currentLineId = id;
                } else if (ev.type === EVENT_TYPES.CREATE_NODE) {
                    if (currentLineId && lines[currentLineId]) {
                        lines[currentLineId].nodes.push({ x: ev.x, y: ev.y });
                    }
                } else if (ev.type === EVENT_TYPES.CREATE_STATION) {
                    if (currentLineId && lines[currentLineId]) {
                        lines[currentLineId].stations.push({
                            id: 'st_' + Date.now() + '_' + i,
                            name: ev.name || '站',
                            en: ev.en || '',
                            x: ev.x,
                            y: ev.y,
                        });
                    }
                }
            }
            return lines;
        }

        // ---- 绘制线路 ----
        function drawLine(ctx, line) {
            const nodes = line.nodes;
            if (nodes.length < 2) return;
            ctx.beginPath();
            const p0 = worldToScreen(nodes[0].x, nodes[0].y);
            ctx.moveTo(p0.x, p0.y);
            for (let i = 1; i < nodes.length; i++) {
                const p = worldToScreen(nodes[i].x, nodes[i].y);
                ctx.lineTo(p.x, p.y);
            }
            ctx.strokeStyle = line.color;
            ctx.lineWidth = 3;
            ctx.shadowColor = line.color + '60';
            ctx.shadowBlur = 10;
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 线路名称 (在第一个节点附近)
            if (nodes.length > 0) {
                const p = worldToScreen(nodes[0].x, nodes[0].y);
                ctx.fillStyle = 'rgba(11,14,20,0.7)';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                const label = line.name;
                const metrics = ctx.measureText(label);
                const tw = metrics.width + 16;
                const th = 26;
                const rx = p.x + 8;
                const ry = p.y - 10 - th;
                ctx.fillStyle = 'rgba(11,14,20,0.6)';
                ctx.beginPath();
                ctx.roundRect(rx, ry, tw, th, 6);
                ctx.fill();
                ctx.fillStyle = line.color;
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(label, rx + 8, ry + th - 4);
            }
        }

        // ---- 绘制站点 ----
        function drawStation(ctx, station, color) {
            const pos = worldToScreen(station.x, station.y);
            const r = 7;
            // 光晕
            const grad = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, r + 12);
            grad.addColorStop(0, color + '50');
            grad.addColorStop(1, color + '00');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, r + 12, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, r, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(255,255,255,0.6)';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        }

        // ---- 绘制站点标签 ----
        function drawStationLabel(ctx, station) {
            const pos = worldToScreen(station.x, station.y);
            const label = station.name + (station.en ? ' (' + station.en + ')' : '');
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            const metrics = ctx.measureText(label);
            const tw = metrics.width + 14;
            const th = 20;
            const rx = pos.x - tw / 2;
            const ry = pos.y - 14 - th;
            ctx.fillStyle = 'rgba(11,14,20,0.7)';
            ctx.beginPath();
            ctx.roundRect(rx, ry, tw, th, 4);
            ctx.fill();
            ctx.fillStyle = '#eef2f6';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(label, pos.x, pos.y - 12);
        }

        // ---- roundRect polyfill ----
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w / 2) r = w / 2;
                if (r > h / 2) r = h / 2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }

        // ================================================================
        //  事件执行引擎
        // ================================================================

        // 执行单个事件 (返回是否完成)
        function executeEvent(ev, progress) {
            // progress 0~1
            switch (ev.type) {
                case EVENT_TYPES.WAIT:
                    // 等待: 只是消耗时间, 无视觉变化
                    return true;

                case EVENT_TYPES.CAMERA:
                    // 摄像机移动 + 缩放
                    const targetX = ev.x !== undefined ? ev.x : camera.x;
                    const targetY = ev.y !== undefined ? ev.y : camera.y;
                    const targetZoom = ev.zoom !== undefined ? ev.zoom : camera.zoom;
                    const duration = ev.duration || 0; // 秒
                    if (duration <= 0 || progress >= 1) {
                        camera.x = targetX;
                        camera.y = targetY;
                        camera.zoom = targetZoom;
                        return true;
                    }
                    // 插值
                    const t = Math.min(progress, 1);
                    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // easeInOut
                    const fromX = ev._fromX !== undefined ? ev._fromX : camera.x;
                    const fromY = ev._fromY !== undefined ? ev._fromY : camera.y;
                    const fromZoom = ev._fromZoom !== undefined ? ev._fromZoom : camera.zoom;
                    camera.x = fromX + (targetX - fromX) * ease;
                    camera.y = fromY + (targetY - fromY) * ease;
                    camera.zoom = fromZoom + (targetZoom - fromZoom) * ease;
                    return false;

                case EVENT_TYPES.CREATE_LINE:
                case EVENT_TYPES.CREATE_NODE:
                case EVENT_TYPES.CREATE_STATION:
                    // 这些事件是瞬间完成的, 但需要记录进度以便显示
                    return true;

                default:
                    return true;
            }
        }

        // 重置执行状态
        function resetExecution() {
            currentIndex = 0;
            eventProgress = 0;
            // 重置相机到初始状态 (第一个事件可能设置)
            camera.x = 0;
            camera.y = 0;
            camera.zoom = 1.0;
            // 清除线路数据 (由事件重新构建)
            linesData = {};
            // 重置事件状态
            for (const ev of events) {
                ev._executed = false;
            }
            render();
            updateEventList();
            updateStats();
        }

        // 播放循环
        function playLoop() {
            if (!isPlaying || isPaused) return;

            if (currentIndex >= events.length) {
                // 播放结束
                stopPlay();
                return;
            }

            const ev = events[currentIndex];
            const step = 0.008; // 每帧进度增量
            eventProgress += step;

            // 执行事件
            const done = executeEvent(ev, eventProgress);

            if (done) {
                // 事件完成, 标记已执行
                ev._executed = true;
                currentIndex++;
                eventProgress = 0;
                // 如果是瞬间事件, 直接渲染
                render();
                updateEventList();
                updateStats();
                // 继续下一帧
                if (currentIndex < events.length) {
                    // 准备下一个事件的初始状态 (用于插值)
                    const nextEv = events[currentIndex];
                    if (nextEv.type === EVENT_TYPES.CAMERA) {
                        nextEv._fromX = camera.x;
                        nextEv._fromY = camera.y;
                        nextEv._fromZoom = camera.zoom;
                    }
                }
                playTimer = requestAnimationFrame(playLoop);
            } else {
                // 事件未完成, 继续渲染
                render();
                updateEventList();
                playTimer = requestAnimationFrame(playLoop);
            }
        }

        function startPlay() {
            if (isPlaying) return;
            if (currentIndex >= events.length) {
                resetExecution();
            }
            isPlaying = true;
            isPaused = false;
            // 如果当前事件是 camera, 记录初始状态
            if (currentIndex < events.length) {
                const ev = events[currentIndex];
                if (ev.type === EVENT_TYPES.CAMERA) {
                    ev._fromX = camera.x;
                    ev._fromY = camera.y;
                    ev._fromZoom = camera.zoom;
                }
            }
            updateStatusUI();
            if (playTimer) cancelAnimationFrame(playTimer);
            playTimer = requestAnimationFrame(playLoop);
        }

        function pausePlay() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            updateStatusUI();
            if (!isPaused) {
                // 继续
                playTimer = requestAnimationFrame(playLoop);
            } else {
                if (playTimer) cancelAnimationFrame(playTimer);
            }
        }

        function stopPlay() {
            isPlaying = false;
            isPaused = false;
            if (playTimer) cancelAnimationFrame(playTimer);
            playTimer = null;
            updateStatusUI();
            render();
            updateEventList();
        }

        function updateStatusUI() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (isPlaying && !isPaused) {
                dot.className = 'dot running';
                text.textContent = '播放中';
            } else if (isPlaying && isPaused) {
                dot.className = 'dot paused';
                text.textContent = '已暂停';
            } else {
                dot.className = 'dot stopped';
                text.textContent = '已停止';
            }
        }

        // ================================================================
        //  事件管理
        // ================================================================

        function addEvent(type, params) {
            const ev = {
                type: type,
                _executed: false,
                ...params,
            };
            // 如果是 camera 事件, 记录当前相机状态作为起始
            if (type === EVENT_TYPES.CAMERA) {
                ev._fromX = camera.x;
                ev._fromY = camera.y;
                ev._fromZoom = camera.zoom;
            }
            events.push(ev);
            // 如果当前没有播放, 重置执行状态
            if (!isPlaying) {
                resetExecution();
            }
            updateEventList();
            updateStats();
            render();
            return ev;
        }

        function deleteEvent(index) {
            if (index < 0 || index >= events.length) return;
            events.splice(index, 1);
            if (!isPlaying) {
                resetExecution();
            }
            updateEventList();
            updateStats();
            render();
        }

        function clearEvents() {
            if (events.length === 0) return;
            if (!confirm('确定清空所有事件吗？')) return;
            events = [];
            resetExecution();
            updateEventList();
            updateStats();
            render();
        }

        function updateStats() {
            document.getElementById('eventCount').textContent = events.length + ' 个事件';
            const progress = events.length > 0 ? (currentIndex / events.length * 100).toFixed(0) : 0;
            // 可以显示进度
        }

        // ================================================================
        //  事件列表 UI
        // ================================================================

        function updateEventList() {
            const container = document.getElementById('eventList');
            if (events.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="big-icon">📭</span>
                        暂无事件<br>
                        <span style="font-size:12px;color:#4a5a70;">点击「添加事件」开始规划</span>
                    </div>
                `;
                return;
            }

            let html = '';
            for (let i = 0; i < events.length; i++) {
                const ev = events[i];
                const isActive = (i === currentIndex && isPlaying);
                const isExecuted = ev._executed || (i < currentIndex);
                let cls = 'event-item';
                if (isActive) cls += ' active';
                if (isExecuted) cls += ' executed';
                else cls += ' pending';

                let icon = '📌';
                let desc = '';
                switch (ev.type) {
                    case EVENT_TYPES.WAIT:
                        icon = '⏳';
                        desc = `等待 ${ev.seconds || 0} 秒`;
                        break;
                    case EVENT_TYPES.CAMERA:
                        icon = '🎥';
                        desc = `摄像机移动到 (${ev.x !== undefined ? ev.x : '—'}, ${ev.y !== undefined ? ev.y : '—'})`;
                        if (ev.zoom !== undefined) desc += ` 缩放 ${(ev.zoom * 100).toFixed(0)}%`;
                        if (ev.duration) desc += ` 耗时 ${ev.duration}s`;
                        break;
                    case EVENT_TYPES.CREATE_LINE:
                        icon = '🟤';
                        desc = `创建线路 「${ev.name || '未命名'}」`;
                        if (ev.color) {
                            desc +=
                            ` <span class="line-color-sample" style="background:${ev.color};display:inline-block;vertical-align:middle;"></span>`;
                        }
                        break;
                    case EVENT_TYPES.CREATE_NODE:
                        icon = '⏺';
                        desc = `拐点 (${ev.x}, ${ev.y})`;
                        break;
                    case EVENT_TYPES.CREATE_STATION:
                        icon = '📍';
                        desc = `站点 「${ev.name || '站'}」`;
                        if (ev.en) desc += ` (${ev.en})`;
                        desc += ` at (${ev.x}, ${ev.y})`;
                        break;
                    default:
                        icon = '❓';
                        desc = '未知事件';
                }

                html += `
                    <div class="${cls}" data-index="${i}">
                        <span class="idx">#${i+1}</span>
                        <span class="icon">${icon}</span>
                        <span class="desc">${desc}</span>
                        <button class="del-btn" data-index="${i}" title="删除事件">✕</button>
                    </div>
                `;
            }
            container.innerHTML = html;

            // 绑定删除事件
            container.querySelectorAll('.del-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.index);
                    deleteEvent(idx);
                });
            });

            // 点击事件选中 (用于编辑)
            container.querySelectorAll('.event-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('del-btn')) return;
                    const idx = parseInt(item.dataset.index);
                    selectedEventIdx = idx;
                    showEventEditor(idx);
                });
            });
        }

        // ================================================================
        //  事件编辑器 (内嵌)
        // ================================================================

        function showEventEditor(index) {

            switch (ev.type) {

                    html += `

                    break;
                case EVENT_TYPES.CREATE_NODE:
                    html += `
                        <div class="row">
                            <label>X</label>
                            <input type="number" id="editNodeX" value="${ev.x || 0}" step="1" />
                            <label>Y</label>
                            <input type="number" id="editNodeY" value="${ev.y || 0}" step="1" />
                        </div>
                    `;
                    break;
                case EVENT_TYPES.CREATE_STATION:
                    html += `
                        <div class="row">
                            <label>中文名</label>
                            <input type="text" id="editStName" value="${ev.name || ''}" />
                            <label>英文名</label>
                            <input type="text" id="editStEn" value="${ev.en || ''}" />
                        </div>
                        <div class="row">

                            <label>Y</label>
                            <input type="number" id="editStY" value="${ev.y || 0}" step="1" />
                        </div>
                    `;
                    break;
                default:
                    html += `<div style="color:#8a9bb5;">未知事件类型</div>`;
            }

            html += `
                    <div class="actions">
                        <button class="btn add" id="saveEventEdit">💾 保存</button>
                        <button class="btn cancel" id="cancelEventEdit">取消</button>
                    </div>
                </div>
            `;
            container.innerHTML = html;

            // 绑定关闭
            document.getElementById('closeEditor')?.addEventListener('click', () => {
                container.innerHTML = '';
                selectedEventIdx = -1;
            });

            // 绑定保存
            document.getElementById('saveEventEdit')?.addEventListener('click', () => {
                saveEventEdit(index);
            });
            document.getElementById('cancelEventEdit')?.addEventListener('click', () => {
                container.innerHTML = '';
                selectedEventIdx = -1;
            });
        }

        function saveEventEdit(index) {
            const ev = events[index];
            if (!ev) return;

            switch (ev.type) {
                case EVENT_TYPES.WAIT:
                    ev.seconds = parseFloat(document.getElementById('editWaitSec')?.value) || 0;
                    break;
                case EVENT_TYPES.CAMERA:
                    ev.x = parseFloat(document.getElementById('editCamX')?.value);
                    ev.y = parseFloat(document.getElementById('editCamY')?.value);
                    ev.zoom = parseFloat(document.getElementById('editCamZoom')?.value) || 1.0;
                    ev.duration = parseFloat(document.getElementById('editCamDur')?.value) || 0;
                    break;
                case EVENT_TYPES.CREATE_LINE:
                    ev.name = document.getElementById('editLineName')?.value || '未命名';
                    ev.color = document.getElementById('editLineColor')?.value || '#f5a623';
                    const lid = document.getElementById('editLineId')?.value.trim();
                    if (lid) ev.lineId = lid;
                    break;
                case EVENT_TYPES.CREATE_NODE:
                    ev.x = parseFloat(document.getElementById('editNodeX')?.value) || 0;
                    ev.y = parseFloat(document.getElementById('editNodeY')?.value) || 0;
                    break;
                case EVENT_TYPES.CREATE_STATION:
                    ev.name = document.getElementById('editStName')?.value || '站';
                    ev.en = document.getElementById('editStEn')?.value || '';
                    ev.x = parseFloat(document.getElementById('editStX')?.value) || 0;
                    ev.y = parseFloat(document.getElementById('editStY')?.value) || 0;
                    break;
            }

            // 重置执行状态
            if (!isPlaying) resetExecution();
            document.getElementById('eventEditorContainer').innerHTML = '';
            selectedEventIdx = -1;
            updateEventList();
            render();
        }

                    case EVENT_TYPES.CREATE_STATION:
                        params.name = document.getElementById('addStName')?.value || '站';
                        params.en = document.getElementById('addStEn')?.value || '';
                        params.x = parseFloat(document.getElementById('addStX')?.value) || 0;
                        params.y = parseFloat(document.getElementById('addStY')?.value) || 0;
                        break;
                }
                addEvent(type, params);
                container.innerHTML = '';
                // 自动滚动到新事件
                const list = document.getElementById('eventList');
                if (list) list.scrollTop = list.scrollHeight;
            });
        }

        // ================================================================
        //  示例事件 (演示)
        // ================================================================

        function generateDemoEvents() {
            // 清空
            events = [];
            // 添加示例: 一条线路 + 站点 + 摄像机移动
            addEvent(EVENT_TYPES.CREATE_LINE, { name: '1号线', color: '#f5a623' });
            addEvent(EVENT_TYPES.CREATE_NODE, { x: 100, y: 100 });
            addEvent(EVENT_TYPES.CREATE_NODE, { x: 400, y: 200 });
            addEvent(EVENT_TYPES.CREATE_NODE, { x: 700, y: 150 });
            addEvent(EVENT_TYPES.CREATE_STATION, { name: '东方大学', en: 'East Uni', x: 100, y: 100 });
            addEvent(EVENT_TYPES.CREATE_STATION, { name: '理工大学', en: 'Tech Uni', x: 400, y: 200 });
            addEvent(EVENT_TYPES.CREATE_STATION, { name: '科技园', en: 'Tech Park', x: 700, y: 150 });
            // 摄像机移动
            addEvent(EVENT_TYPES.CAMERA, { x: 350, y: 200, zoom: 1.2, duration: 2 });
            addEvent(EVENT_TYPES.WAIT, { seconds: 1 });
            addEvent(EVENT_TYPES.CAMERA, { x: 100, y: 100, zoom: 1.5, duration: 1.5 });
            addEvent(EVENT_TYPES.WAIT, { seconds: 0.5 });
            addEvent(EVENT_TYPES.CAMERA, { x: 0, y: 0, zoom: 1.0, duration: 2 });

            // 重置执行状态
            resetExecution();
            // 初始相机位置
            if (events.length > 0) {
                const firstCam = events.find(e => e.type === EVENT_TYPES.CAMERA);
                if (firstCam) {
                    camera.x = firstCam.x || 0;
                    camera.y = firstCam.y || 0;
                    camera.zoom = firstCam.zoom || 1.0;
                }
            }
        }

        // ================================================================
        //  UI 绑定
        // ================================================================

        function bindUI() {
            document.getElementById('btnPlay').addEventListener('click', startPlay);
            document.getElementById('btnPause').addEventListener('click', pausePlay);
            document.getElementById('btnReset').addEventListener('click', () => {
                stopPlay();
                resetExecution();
            });
            document.getElementById('btnAddEvent').addEventListener('click', showAddEventDialog);
            document.getElementById('btnClearEvents').addEventListener('click', clearEvents);

            // 鼠标位置跟踪 (用于添加事件时获取坐标)
            canvas.addEventListener('mousemove', (e) => {
                const pos = getCanvasCoords(e);
                window._lastMousePos = pos;
            });

            // 背景图片上传 (拖拽或点击)
            canvas.addEventListener('dblclick', () => {
                // 双击上传背景
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            bgImage = img;
                            bgImageLoaded = true;
                            render();
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                };
                input.click();
            });

            // 键盘快捷键
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (isPlaying) {
                        pausePlay();
                    } else {
                        startPlay();
                    }
                }
                if (e.key === 'r' || e.key === 'R') {
                    stopPlay();
                    resetExecution();
                }
                if (e.key === 'Escape') {
                    document.getElementById('eventEditorContainer').innerHTML = '';
                    selectedEventIdx = -1;
                }
            });
        }

        // ================================================================
        //  启动
        // ================================================================

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
